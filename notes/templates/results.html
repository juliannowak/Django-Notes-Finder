{% if midi_results %}
  {% for name, url, site, source_url in midi_results %}
  <h1>Result #</h1>
    <h4><a style="display: block; text-indent: 50px;">{{name}}</a></h4><br/>
    <input type="button" value="Midi" href="{% url 'midi' midi_name=name %}">
    <input type="button" value="Sheet Music">
    <br>
    <a href="{{source_url}}" download>Download source from {{site}}</a>
  {% endfor %}
  <br>
  <h4>more results</h4>
{% else %}
  <p>No results found.</p>
{% endif %}
